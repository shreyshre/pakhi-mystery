<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recovered File</title>

  <link rel="stylesheet" href="../css/riddle.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="background"></div>

  <div class="container">

    <p class="top-text">RECOVERED INTERROGATION FILE</p>

    <h1>
      “One bite.
      Chaos everywhere.
      Yet somehow,
      we always go back for more.”
    </h1>

    <p class="question">
      Name our weakness.
    </p>

    <input
      type="text"
      id="answer"
      placeholder="Enter answer..."
    >

    <button id="submitBtn">
      VERIFY
    </button>

    <div id="result"></div>

  </div>

  <script src="../js/riddle.js"></script>

</body>
</html>
