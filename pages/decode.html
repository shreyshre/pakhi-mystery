<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Decode Transmission</title>

  <link rel="stylesheet" href="../css/decode.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="background"></div>

  <div class="container">

    <p class="top-text">
      TRANSMISSION RECOVERED
    </p>

    <h1>
      “Every recovered number hides a letter.”
    </h1>

    <p class="sub">
      Use the alphabet key to decode the transmission.
    </p>

    <div class="code-box">

      

    </div>

    <input
      type="text"
      id="answer"
      placeholder="Enter decoded word..."
    >

    <button id="decodeBtn">
      VERIFY TRANSMISSION
    </button>

    <div id="result"></div>

  </div>

  <script src="../js/decode.js"></script>

</body>
</html>
