<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Final Signal</title>

  <link rel="stylesheet" href="../css/stars.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="background"></div>

  <div class="container">

    <p class="top-text">
      FINAL SIGNAL DETECTED
    </p>

    <h1>
      “His final signal came from the stars.”
    </h1>

    <p class="sub">
      Repeat the constellation sequence.
    </p>

    <div class="stars">

      <div class="star" data-id="0"></div>
      <div class="star" data-id="1"></div>
      <div class="star" data-id="2"></div>
      <div class="star" data-id="3"></div>
      <div class="star" data-id="4"></div>

    </div>

    <button id="startBtn">
      START SIGNAL
    </button>

    <div id="result"></div>

  </div>

  <script src="../js/stars.js"></script>

</body>
</html>
